<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FocusFlow - Smart Study Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>FocusFlow</h1>
      <div class="controls">
        <button id="themeToggle" title="Toggle theme">🌙</button>
      </div>
    </header>

    <main>
      <section class="left">
        <form id="taskForm" class="card">
          <h2>Add Task</h2>
          <input id="title" placeholder="Task title" required />
          <input id="subject" placeholder="Subject (e.g. Physics)" />
          <div class="row">
            <input id="deadline" type="date" />
            <select id="priority">
              <option value="low">Low priority</option>
              <option value="medium" selected>Medium priority</option>
              <option value="high">High priority</option>
            </select>
          </div>
          <textarea id="notes" placeholder="Notes (optional)"></textarea>
          <div class="row">
            <button type="submit" class="primary">Add Task</button>
            <button type="button" id="clearAll">Clear All</button>
          </div>
        </form>

        <div class="card timer">
          <h2>Pomodoro Timer</h2>
          <div class="timer-display">
            <span id="timerMin">25</span>:<span id="timerSec">00</span>
          </div>
          <div class="row">
            <button id="startTimer" class="primary">Start</button>
            <button id="pauseTimer">Pause</button>
            <button id="resetTimer">Reset</button>
          </div>
          <div class="small">Session length: <input id="sessionLength" type="number" min="1" value="25" /> minutes</div>
        </div>
      </section>

      <section class="right">
        <div class="card stats">
          <h2>Overview</h2>
          <div class="progressWrap">
            <div class="progressBar" id="progressBar"><div class="progressFill" id="progressFill"></div></div>
            <div class="progressText" id="progressText">0 / 0 tasks completed</div>
          </div>
          <div class="quote" id="quote">"Stay focused. Keep going."</div>
        </div>

        <div class="card tasksCard">
          <h2>Tasks</h2>
          <ul id="taskList" class="taskList"></ul>
        </div>
      </section>
    </main>

    <footer>
      <small>FocusFlow • Save locally • Responsive</small>
    </footer>
  </div>

  <template id="taskTemplate">
    <li class="task">
      <div class="leftInfo">
        <h3 class="taskTitle"></h3>
        <div class="meta"><span class="subject"></span> • <span class="deadline"></span></div>
      </div>
      <div class="rightInfo">
        <div class="priority"></div>
        <div class="actions">
          <button class="completeBtn">✓</button>
          <button class="editBtn">✎</button>
          <button class="delBtn">🗑</button>
        </div>
      </div>
    </li>
  </template>

  <script src="script.js"></script>
</body>
</html>
